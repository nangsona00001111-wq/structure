!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>structure.html</title>

<style>
        /* General style */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        /* Header */
        header {
            background-color: #eadfff;
            border: 1px solid purple;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Navigation */
        nav {
            background-color: #d9edff;
            border: 2px solid steelblue;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 10px;
        }

        nav a {
            text-decoration: none;
            margin: 15px;
            color: darkblue;
        }

        /* Main layout */
        main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Article */
        article {
            background-color: #fbe3d8;
            border: 2px solid coral;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
        }

        /* Section */
        section {
            background-color: #e6e1ff;
            border: 2px solid mediumpurple;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
        }

        /* Aside */
        aside {
            background-color: #d9edff;
            border: 2px solid steelblue;
            border-radius: 12px;
            padding: 20px;
        }

        /* Footer */
        footer {
            background-color: #d9f2e8;
            border: 2px solid seagreen;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h2>HEADER</h2>
    </header>

    <nav>
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
    </nav>

    <main>

        <div>
            <article>
                <h2>ARTICLE</h2>
                <p>This is article content.</p>
            </article>

            <br>

            <section>
                <h2>SECTION</h2>
                <p>This is section content.</p>
            </section>
        </div>

        <aside>
            <h2>ASIDE</h2>
            <p>This is sidebar content.</p>
        </aside>

    </main>

    <footer>
        <h2>FOOTER</h2>
        <p>Copyright © 2026 My Website</p>
    </footer>

</body>
</html>
